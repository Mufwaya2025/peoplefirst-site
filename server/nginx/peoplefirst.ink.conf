# HTTP -> HTTPS (keep ACME reachable for renewals)
server {
    listen 80;
    listen [::]:80;
    server_name peoplefirst.ink www.peoplefirst.ink;

    location ^~ /.well-known/acme-challenge/ { root /var/www/peoplefirst.ink; }
    location / { return 301 https://peoplefirst.ink$request_uri; }
}

# www -> apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.peoplefirst.ink;

    ssl_certificate /etc/letsencrypt/live/peoplefirst.ink/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/peoplefirst.ink/privkey.pem;

    return 301 https://peoplefirst.ink$request_uri;
}

# apex - static site + contact API
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name peoplefirst.ink;

    ssl_certificate /etc/letsencrypt/live/peoplefirst.ink/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/peoplefirst.ink/privkey.pem;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    root /var/www/peoplefirst.ink;
    index index.html;
    error_page 404 /404.html;

    # Security headers. Declared once at server level; the location blocks below
    # deliberately use `expires` (not add_header) so these are inherited everywhere.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    # contact form backend (pm2: peoplefirst-contact)
    location /api/ {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        client_max_body_size 64k;
        limit_except GET POST { deny all; }
    }

    # HTML: always revalidate. Assets: cache a day (URLs carry ?v=hash so updates show immediately).
    location ~* \.html$ { expires -1; }
    location ~* \.(css|js)$ { expires 1d; }
    location ~* \.(svg|png|jpg|jpeg|webp|ico|woff2?)$ { expires 30d; }

    # never serve dotfiles or backups
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(bak|old|orig|sh|env)$ { deny all; }

    location / { try_files $uri $uri/ =404; }
}
