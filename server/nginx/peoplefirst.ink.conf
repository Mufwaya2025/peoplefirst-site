# HTTP -> HTTPS (keep ACME reachable for renewals)
server {
    listen 80;
    listen [::]:80;
    server_name peoplefirst.ink www.peoplefirst.ink;

    location ^~ /.well-known/acme-challenge/ { root /var/www/peoplefirst.ink; }
    location / { return 301 https://peoplefirst.ink$request_uri; }
}

# www -> apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.peoplefirst.ink;

    ssl_certificate /etc/letsencrypt/live/peoplefirst.ink/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/peoplefirst.ink/privkey.pem;

    return 301 https://peoplefirst.ink$request_uri;
}

# apex - static site + contact API
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name peoplefirst.ink;

    ssl_certificate /etc/letsencrypt/live/peoplefirst.ink/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/peoplefirst.ink/privkey.pem;

    root /var/www/peoplefirst.ink;
    index index.html;
    error_page 404 /404.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

    # contact form backend (pm2: peoplefirst-contact)
    location /api/ {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        client_max_body_size 64k;
    }

    location = /index.html { add_header Cache-Control "no-cache"; }
    location ~* \.(css|js)$ { add_header Cache-Control "public, max-age=86400"; }
    location / { try_files $uri $uri/ =404; }
}
